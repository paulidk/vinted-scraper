# Copy to config.yaml and adjust. ${VAR} / ${VAR:-default} are read from the environment.

interval_minutes: 30      # how often to scrape; each search can override it with its own interval_minutes
jitter_minutes: 4         # random +/- so runs never happen at exact, bot-like intervals (max 1/4 of an interval)
quiet_hours: [1, 7]       # no runs from 01:00 to 07:00 local time (also "23:30"); remove to run day and night
database: data/vinted.db

client:
  domain: www.vinted.de   # default Vinted country site (www.vinted.fr, www.vinted.nl, www.vinted.pl, ...)
  min_delay: 2            # seconds between requests (randomised between min and max)
  max_delay: 6
  # Browser fingerprints to rotate through when Cloudflare pushes back.
  impersonate: [chrome, chrome131, chrome124, edge101, safari17_0]
  # Optional, only needed if your IP gets blocked. Residential proxies work best.
  proxies: []
  #  - http://user:pass@proxy-host:port

notifiers:
  - type: console
  # - type: discord
  #   webhook_url: ${DISCORD_WEBHOOK}
  # - type: telegram
  #   bot_token: ${TELEGRAM_BOT_TOKEN}
  #   chat_id: ${TELEGRAM_CHAT_ID}
  # - type: ntfy
  #   topic_url: https://ntfy.sh/my-secret-vinted-topic
  # - type: webhook
  #   url: https://example.com/hook

searches:
  # ---------------------------------------------------------------- mini PCs
  - name: mini-pc
    interval_minutes: 20    # the main target and fastest to sell: check more often than the default
    # Every search term runs on each site listed here, Vinted first, and all results are ranked
    # together (one top 3). `params` are Vinted's filters, `kleinanzeigen` Kleinanzeigen's.
    # sites: [vinted, kleinanzeigen]
    # kleinanzeigen: {category: 228, shipping: true}   # 228 = PCs; most others are pickup only
    queries:
      - optiplex micro
      - thinkcentre tiny
      - thinkcentre m720q
      - thinkcentre m920q
      - thinkcentre m70q
      - thinkcentre m90q
      - elitedesk mini
      - prodesk mini
      - hp elite mini
      - esprimo q
      - intel nuc
      - beelink
      - minisforum
      - mini pc
    # Instead of (or in addition to) queries you can paste a search URL from your browser,
    # filters included:  url: "https://www.vinted.de/catalog?search_text=optiplex&price_to=150"
    min_price: 20
    max_price: 250
    pages: 5                # max result pages (96 listings each) per query. Each query is fetched
                            # this deep once; later runs stop at listings already seen, usually page 1
    exclude: "\\b(monitor|bildschirm|écran|tastatur|keyboard|clavier|netzteil only|nur netzteil|vesa|halterung|stand)\\b"
    fetch_details: 10       # fetch up to N descriptions per run when the title lacks CPU/RAM
    notify:
      min_value: 8          # points per 100 EUR; use `vinted-scraper top` to calibrate
      top: 5                # max notifications per run
      price_drop: true
      # Top-3 mode: instead of one alert per deal, keep a ranking of the best 3 listings and
      # send it (as one message) only when it changes: something new enters, the order
      # changes, a listing on it gets cheaper, or one is sold. 0 = one alert per deal.
      podium: 3
      podium_hours: 72      # items missing from search results stay ranked this long, if still for sale
    scorer:
      type: computer
      min_cpu_mark: 4500    # ~ i5-6500T; raise to e.g. 8000 for 8th gen+ only
      min_ram_gb: 4
      assume_ram_gb: 8      # when the listing doesn't say
      reject: [defect, lot, cpu_only, offsite]  # cpu_only = a loose CPU/board/graphics card,
                                                # offsite = asks to pay outside Vinted; also: barebone, no_psu
      shipping_estimate: 6
      kwh_price: 0.32       # electricity cost per kWh ...
      years: 2              # ... over this many years of 24/7 use is added to the price
      weights:
        cpu: 1.0            # points per 1000 PassMark
        ram: 0.4            # points per GB, up to ram_cap
        ram_cap: 32
        storage: 0.006      # points per GB, up to storage_cap
        storage_cap: 1000
        ssd_bonus: 1.0
      form_factor:          # multipliers
        tiny: 1.15
        sff: 1.0
        tower: 0.8
        laptop: 0.9
        unknown: 0.95
      # cpu_overrides:      # add / correct CPUs: model: [passmark, tdp]
      #   i5-8500t: [8700, 35]

  # ------------------------------------------- every desktop PC, towers and servers
  # Vinted's text search is fuzzy, so this takes the whole "Desktop-Computer" category
  # (3581) newest first and lets the scorer find the gems.
  # - name: desktops
  #   sites: [vinted, kleinanzeigen]
  #   url: "https://www.vinted.de/catalog?catalog[]=3581"
  #   kleinanzeigen: {category: 228, shipping: true}    # and Kleinanzeigen's whole PCs category
  #   min_price: 30
  #   max_price: 500
  #   fetch_details: 10
  #   notify: {min_value: 5, podium: 3}
  #   scorer:
  #     type: computer
  #     min_cpu_mark: 6000
  #     require_cpu: true
  #     min_ram_gb: 8
  #     reject: [defect, lot, cpu_only, offsite, barebone, no_psu]
  #     shipping_estimate: 12
  #     # gpu: points per 1000 G3D Mark of a graphics card (GTX 1070 ≈ 13500 → 6.75 points)
  #     weights: {ram: 0.3, ram_cap: 64, storage: 0.004, storage_cap: 2000, gpu: 0.5}
  #     form_factor: {tiny: 1, sff: 1, tower: 1, server: 1, unknown: 1, laptop: 0}   # 0 = never rank laptops
  #
  # Servers: rare names, so sort by relevance instead of newest first. Dual CPUs ("2x Xeon")
  # count twice, and rack/tower servers get 35 W extra idle draw (`extra_watts`), which is
  # what makes most of them expensive to run 24/7. Lower `hours_per_day` if yours won't be.
  # - name: servers
  #   interval_minutes: 120   # few new listings, and they don't sell within the hour
  #   sites: [vinted, kleinanzeigen]
  #   queries: [poweredge, proliant, supermicro, xeon, epyc, primergy, thinksystem, rack server,
  #             workstation, dell precision, hp z440, hp z4 g4, thinkstation]
  #   params: {order: relevance}
  #   kleinanzeigen: {shipping: true}
  #   # relevance search also returns mini PCs; keep the titles server-like
  #   include: "\\b(server|serveur|servidor|serwer|rack|[124]u|poweredge|proliant|primergy|thinksystem|thinkserver|supermicro|xeon|epyc|workstation|precision|z[2-8]\\d0|z[2-8]\\s*g[1-5]|celsius|thinkstation)\\b"
  #   pages: 2
  #   min_price: 30
  #   max_price: 800
  #   fetch_details: 10
  #   notify: {min_value: 3, podium: 3}
  #   scorer:
  #     type: computer
  #     min_cpu_mark: 5000
  #     require_cpu: true
  #     assume_ram_gb: 16
  #     reject: [defect, lot, cpu_only, offsite]   # barebones are kept, scored with 0 GB RAM
  #     shipping_estimate: 20
  #     weights: {ram: 0.2, ram_cap: 256, storage: 0.003, storage_cap: 8000}
  #     form_factor: {tiny: 1, sff: 1, tower: 1, server: 1, unknown: 1, laptop: 0}   # 0 = never rank laptops
  #     # extra_watts: {server: 35, tower: 5}

  # ------------------------------------------- Kleinanzeigen.de
  # Add `kleinanzeigen` to `sites` in any search above, or search it alone with `site: kleinanzeigen`
  # (then `params` holds its filters). Without search terms it takes the whole category
  # (228 PCs, 225 PC accessories, 278 notebooks). Most listings there are pickup only, so keep
  # `shipping: true`, or paste a search URL with your town and radius in it:
  #   url: "https://www.kleinanzeigen.de/s-pcs/halle/c228l2409r50"
  # `offsite` (pay outside Vinted) is ignored for Kleinanzeigen listings: PayPal is normal there.

  # ------------------------------------------- RAM upgrades: GB per 100 €
  # Reads kits ("32GB (2x16GB)", "2 × 8 GB", "Lot de 2 barrettes 8 Go"), DDR generation, SO-DIMM vs.
  # desktop DIMM and speed. Listings that don't say the generation or module type get their
  # description fetched, then are skipped if it doesn't say either.
  # - name: sodimm-ram
  #   interval_minutes: 60
  #   sites: [vinted, kleinanzeigen]
  #   queries: [ddr4 sodimm, so-dimm ddr4, ddr4 laptop ram, notebook arbeitsspeicher ddr4,
  #             16gb ddr4 sodimm, 32gb ddr4 sodimm, 2x16gb ddr4 sodimm]
  #   kleinanzeigen: {shipping: true}
  #   pages: 2
  #   min_price: 5
  #   max_price: 150
  #   fetch_details: 10
  #   notify: {min_value: 25, podium: 3, price_drop: true}   # 25 GB per 100 € = 4 €/GB incl. fees + shipping
  #   scorer:
  #     type: ram
  #     ddr: 4               # Intel 6th–11th gen and Ryzen up to 5000: DDR4; most 12th gen+ minis: 5
  #     module: sodimm       # sodimm (laptops, mini PCs), dimm (desktops) or any
  #     min_gb: 16           # per listing (stick or kit)
  #     max_sticks: 2        # free slots
  #     # max_gb: 64
  #     # min_mhz: 2666      # faster sticks run at the CPU's speed, slower ones slow it down
  #     # gb_cap: 64         # GB counted up to this much
  #     reject: [defect, offsite, ecc, machine]   # machine = a whole laptop/PC that lists its RAM
  #     shipping_estimate: 5

