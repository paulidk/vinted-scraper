<html lang="en">
<head>

<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2228; --muted: #66707b; --border: #dde1e6;
  --accent: #0b7d6f; --accent-text: #fff; --danger: #b42318; --ok: #12784a; --input: #fff; --chip: #eef1f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171b; --panel: #1c2026; --text: #e6e9ed; --muted: #98a2ad; --border: #2e343c;
    --accent: #2bb3a1; --accent-text: #08201c; --danger: #f97066; --ok: #47cd89; --input: #15191e; --chip: #262c34; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; }
header h1 { font-size: 16px; margin: 0; }

header .spacer { flex: 1; }
#status { font-size: 13px; }
#status.err { color: var(--danger); } #status.ok { color: var(--ok); }
nav { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav button { border: 0; background: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; font: inherit; white-space: nowrap; }
nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card > summary { cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; list-style: none; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::before { content: "▸"; color: var(--muted); }
.card[open] > summary::before { content: "▾"; }
.card > summary .tag { font-weight: 400; color: var(--muted); font-size: 12px; background: var(--chip); padding: 1px 8px; border-radius: 99px; }
.card > summary .grow { flex: 1; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f.full { grid-column: 1 / -1; }
label.f .hint { font-size: 11px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; margin-right: 14px; }
label.check input { width: auto; }
button.btn { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.btn.danger { color: var(--danger); }
button.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
.rules td input { padding: 4px 6px; }
.result { margin-top: 10px; padding: 10px; border-radius: 6px; background: var(--chip); font-size: 13px; overflow-wrap: anywhere; }
.result b { font-size: 18px; }
.muted { color: var(--muted); }
.deal img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; background: var(--chip); }
.deal .value { font-weight: 700; font-size: 16px; }
.deal a { color: var(--text); }
.scroll { overflow-x: auto; }
.podiums { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 14px; }
.podiums .card { margin: 0; }
.podiums h4 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.place { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--border); }
.place .medal { font-size: 20px; line-height: 1.1; }
.place a { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
.place .value { font-weight: 700; font-size: 16px; text-align: right; white-space: nowrap; }
@media (max-width: 600px) { .hide-sm { display: none; } main { padding: 12px; } }
</style>

<script>
"use strict";
let cfg = {};
let dirty = false;
let tab = "searches";
const openCards = new WeakSet();  // search objects whose card is expanded

// ---------------------------------------------------------------- helpers
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c);

}
const obj = (parent, key) => (parent[key] && typeof parent[key] === "object" && !Array.isArray(parent[key])) ? parent[key] : (parent[key] = {});
function touch() { dirty = true; setStatus("Unsaved changes", ""); }
function setStatus(text, kind) { const s = document.getElementById("status"); s.textContent = text; s.className = kind || ""; }

// A form field bound to target[key]. Empty input removes the key so the scraper's default applies.
function field(target, key, label, opts = {}) {
  const type = opts.type || "text";
  const cur = target[key];
  let input;
  const set = (v) => { if (v === "" || v === null || v === undefined || (Array.isArray(v) && !v.length)) delete target[key]; else target[key] = v; touch(); opts.onchange && opts.onchange(); };
  if (type === "select") {
    input = h("select", { onchange: (e) => set(e.target.value) },
      opts.options.map(([v, t]) => h("option", { value: v, selected: String(cur ?? opts.default ?? "") === v }, t)));
  } else if (type === "lines") {
    input = h("textarea", { rows: opts.rows || 4, placeholder: opts.placeholder || "", value: (cur || []).join("\n"),
      oninput: (e) => set(e.target.value.split("\n").map((s) => s.trim()).filter(Boolean)) });
  } else if (type === "number") {
    input = h("input", { type: "number", step: opts.step || "any", placeholder: opts.placeholder ?? "", value: cur ?? "",
      oninput: (e) => set(e.target.value === "" ? "" : Number(e.target.value)) });
  } else {
    input = h("input", { type: opts.secret ? "password" : "text", placeholder: opts.placeholder || "", value: cur ?? "", list: opts.list,
      spellcheck: false, oninput: (e) => set(e.target.value) });
    if (opts.secret) input.addEventListener("focus", () => (input.type = "text"));
  }
  return h("label", { class: "f" + (opts.full ? " full" : "") }, label, input, opts.hint ? h("span", { class: "hint" }, opts.hint) : null);
}
function check(target, key, label, dflt) {
  return h("label", { class: "check" }, h("input", { type: "checkbox", checked: target[key] ?? dflt,
    onchange: (e) => { target[key] = e.target.checked; touch(); } }), label);
}

// Remove empty strings/arrays/objects so the YAML stays minimal and defaults apply.
function clean(v) {
  if (Array.isArray(v)) return v.map(clean).filter((x) => x !== undefined);
  if (v && typeof v === "object") {
    const out = {};
    for (const [k, x] of Object.entries(v)) {
      const c = clean(x);
      if (c === undefined || c === "" || (Array.isArray(c) && !c.length) || (c && typeof c === "object" && !Array.isArray(c) && !Object.keys(c).length)) continue;
      out[k] = c;
    }
    return out;
  }

}
// The scraper accepts query/url or queries/urls; the UI always edits the list form.
function normalize(c) {
  c.searches = c.searches || [];
  for (const s of c.searches) {
    if (s.query !== undefined) { s.queries = [s.query, ...(s.queries || [])]; delete s.query; }
    if (s.url !== undefined) { s.urls = [s.url, ...(s.urls || [])]; delete s.url; }
    if (s.site !== undefined) { s.sites = [s.site]; delete s.site; }
    // a Kleinanzeigen- or eBay-only search may keep its filters in params; the form always uses the site's key
    for (const site of ["kleinanzeigen", "ebay"])
      if (String(s.sites) === site && s.params && !s[site]) { s[site] = s.params; delete s.params; }
    s.scorer = s.scorer || { type: "rules" };
  }
  c.notifiers = c.notifiers || [];
  return c;
}
const SITE_NAMES = { vinted: "Vinted", kleinanzeigen: "Kleinanzeigen", ebay: "eBay" };
const siteOfUrl = (u) => (u.includes("kleinanzeigen.") ? "kleinanzeigen" : /(^|[\/.])ebay\./.test(u) ? "ebay" : "vinted");
function sitesOf(s) {
  if (s.sites?.length) return s.sites;
  const found = new Set((s.urls || []).map(siteOfUrl));
  return found.size ? Object.keys(SITE_NAMES).filter((x) => found.has(x)) : ["vinted"];
}
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
  if (!res.ok && data.ok !== false) data.error = `HTTP ${res.status}`;
  return data;
}

// --------------------------------------------------------------- scorers
const SCORER_DEFAULTS = {
  computer: () => ({ type: "computer", min_cpu_mark: 4500, min_ram_gb: 4, reject: ["defect", "lot", "cpu_only", "offsite"], shipping_estimate: 6, kwh_price: 0.32, years: 2 }),
  ram: () => ({ type: "ram", ddr: 4, module: "sodimm", min_gb: 16, max_sticks: 2, reject: ["defect", "offsite", "ecc", "machine"], shipping_estimate: 5 }),
  drive: () => ({ type: "drive", kind: "hdd", form: "3.5", min_tb: 4, reject: ["defect", "offsite", "sas", "device"], kwh_price: 0.32, years: 2, shipping_estimate: 6 }),
  nas: () => ({ type: "nas", min_bays: 2, min_year: 2015, require_model: true, reject: ["defect", "offsite", "accessory"], shipping_estimate: 10 }),
  rules: () => ({ type: "rules", base: 10, rules: [] }),
  price: () => ({ type: "price" }),
};
const TEMPLATES = {
  "Mini PC": () => ({ name: "mini-pc", sites: ["vinted", "kleinanzeigen"], kleinanzeigen: { category: 228, shipping: true },
    queries: ["optiplex micro", "thinkcentre tiny", "thinkcentre m720q", "thinkcentre m920q", "elitedesk mini", "prodesk mini", "intel nuc", "mini pc"], min_price: 20, max_price: 250,
    exclude: "\\b(monitor|bildschirm|écran|tastatur|keyboard|clavier|vesa|halterung)\\b", fetch_details: 10,
    notify: { min_value: 8, top: 5, price_drop: true }, scorer: SCORER_DEFAULTS.computer() }),
  "Desktop PCs (whole category)": () => ({ name: "desktops", sites: ["vinted", "kleinanzeigen"], urls: ["https://www.vinted.de/catalog?catalog[]=3581"],
    kleinanzeigen: { category: 228, shipping: true }, min_price: 30, max_price: 500,
    fetch_details: 10, notify: { min_value: 5, podium: 3, price_drop: true },
    scorer: { ...SCORER_DEFAULTS.computer(), min_cpu_mark: 6000, require_cpu: true, shipping_estimate: 12, weights: { gpu: 0.5 },
      reject: ["defect", "lot", "cpu_only", "offsite", "barebone", "no_psu"],
      form_factor: { tiny: 1, sff: 1, tower: 1, server: 1, unknown: 1, laptop: 0 } } }),
  "Servers & workstations": () => ({ name: "servers", sites: ["vinted", "kleinanzeigen"], kleinanzeigen: { shipping: true },
    queries: ["poweredge", "proliant", "supermicro", "xeon", "epyc", "primergy", "thinksystem", "rack server", "workstation", "dell precision", "hp z440", "thinkstation"],
    params: { order: "relevance" }, include: "\\b(server|serveur|servidor|serwer|rack|[124]u|poweredge|proliant|primergy|thinksystem|thinkserver|supermicro|xeon|epyc|workstation|precision|z[2-8]\\d0|z[2-8]\\s*g[1-5]|celsius|thinkstation)\\b", pages: 2, min_price: 30, max_price: 800, fetch_details: 10, notify: { min_value: 3, podium: 3, price_drop: true },
    scorer: { ...SCORER_DEFAULTS.computer(), min_cpu_mark: 5000, require_cpu: true, assume_ram_gb: 16, shipping_estimate: 20,
      weights: { ram: 0.2, ram_cap: 256, storage: 0.003, storage_cap: 8000 }, form_factor: { tiny: 1, sff: 1, tower: 1, server: 1, unknown: 1, laptop: 0 } } }),
  "SO-DIMM RAM (DDR4)": () => ({ name: "sodimm-ram", sites: ["vinted", "kleinanzeigen"], kleinanzeigen: { shipping: true }, interval_minutes: 60,
    queries: ["ddr4 sodimm", "so-dimm ddr4", "ddr4 laptop ram", "notebook arbeitsspeicher ddr4", "16gb ddr4 sodimm", "32gb ddr4 sodimm", "2x16gb ddr4 sodimm"],
    pages: 2, min_price: 5, max_price: 150, fetch_details: 10, notify: { min_value: 25, podium: 3, price_drop: true }, scorer: SCORER_DEFAULTS.ram() }),
  "Hard drives (3.5\" HDD)": () => ({ name: "hdd", sites: ["vinted", "kleinanzeigen"], kleinanzeigen: { shipping: true }, interval_minutes: 60,
    queries: ["wd red", "seagate ironwolf", "toshiba n300", "seagate exos", "wd ultrastar", "hgst", "nas festplatte", "festplatte 3,5", "hdd 4tb", "hdd 8tb", "hdd 12tb", "wd elements desktop", "wd my book"],
    pages: 2, min_price: 15, max_price: 400, fetch_details: 5, notify: { min_value: 3, podium: 3, price_drop: true }, scorer: SCORER_DEFAULTS.drive() }),
  "NAS": () => ({ name: "nas", sites: ["vinted", "kleinanzeigen"], kleinanzeigen: { shipping: true }, interval_minutes: 60,
    queries: ["synology", "diskstation", "qnap", "asustor", "terramaster", "ugreen nas", "nas 2 bay", "nas 4 bay", "nas server"],
    pages: 2, min_price: 30, max_price: 600, fetch_details: 10, notify: { min_value: 3, podium: 3, price_drop: true }, scorer: SCORER_DEFAULTS.nas() }),
  "Any item (rules)": () => ({ name: "", queries: [], notify: { min_value: 0, top: 5, price_drop: true }, scorer: SCORER_DEFAULTS.rules() }),
  "Cheapest first": () => ({ name: "", queries: [], notify: { top: 3, price_drop: true }, scorer: SCORER_DEFAULTS.price() }),
};

function computerScorer(sc) {
  const w = obj(sc, "weights"), ff = obj(sc, "form_factor"), xw = obj(sc, "extra_watts");
  const reject = new Set(sc.reject ?? ["defect", "lot", "cpu_only", "offsite"]);

    onchange: (e) => { e.target.checked ? reject.add(flag) : reject.delete(flag); sc.reject = [...reject]; touch(); } }), label);

      field(w, "ram", "Points per GB RAM", { type: "number", placeholder: "0.4" }),
      field(w, "ram_cap", "RAM counted up to (GB)", { type: "number", placeholder: "32" }),

      field(w, "wifi_bonus", "Wi-Fi bonus", { type: "number", placeholder: "0" }),
      field(w, "gpu", "Points per 1000 GPU score (G3D)", { type: "number", placeholder: "0", hint: "GTX 1070 ≈ 13500, RTX 3060 ≈ 17000; 0 ignores the card" })),
    h("h3", {}, "Form factor multipliers"),
    h("div", { class: "grid" },
      field(ff, "tiny", "Micro / Tiny / Mini", { type: "number", placeholder: "1.15" }),
      field(ff, "sff", "SFF", { type: "number", placeholder: "1.0" }),
      field(ff, "tower", "Tower", { type: "number", placeholder: "0.8" }),
      field(ff, "server", "Server (rack, PowerEdge, ProLiant…)", { type: "number", placeholder: "0.8" }),

function ramScorer(sc) {
  const reject = new Set(sc.reject ?? ["defect", "offsite", "ecc", "machine"]);
  const rejectBox = (flag, label) => h("label", { class: "check" }, h("input", { type: "checkbox", checked: reject.has(flag),

function rejectBoxes(sc, dflt, items) {

    onchange: (e) => { e.target.checked ? reject.add(flag) : reject.delete(flag); sc.reject = [...reject]; touch(); } }), label));

function rulesScorer(sc) {
  sc.rules = sc.rules || [];
  const body = h("tbody");
  const draw = () => {
    body.replaceChildren(...sc.rules.map((r, i) => h("tr", {},
      h("td", {}, h("input", { value: r.match || "", placeholder: "regex, e.g. \\b(new|neu)\\b", spellcheck: false, oninput: (e) => { r.match = e.target.value; touch(); } })),
      ...["points", "per_unit", "max"].map((k) => h("td", {}, h("input", { type: "number", step: "any", value: r[k] ?? "",
        oninput: (e) => { e.target.value === "" ? delete r[k] : (r[k] = Number(e.target.value)); touch(); } }))),
      h("td", {}, h("select", { onchange: (e) => { e.target.value === "text" ? delete r.field : (r.field = e.target.value); touch(); } },
        ["text", "title", "brand", "condition"].map((f) => h("option", { value: f, selected: (r.field || "text") === f }, f)))),
      h("td", {}, h("button", { class: "btn danger", title: "Remove rule", onclick: () => { sc.rules.splice(i, 1); touch(); draw(); } }, "×")))));
  };
  draw();
  return [
    h("div", { class: "grid" },

      field(sc, "shipping_estimate", "Shipping estimate", { type: "number", placeholder: "0" })),
    h("h3", {}, "Rules"),

function scoreTester(s) {
  const t = { title: "", description: "", price: "" };
  const out = h("div");
  const run = async () => {
    const r = await api("/api/score", { scorer: clean(s.scorer), title: t.title, description: t.description, price: Number(t.price) || 0 });
    out.replaceChildren(r.error ? h("div", { class: "result", style: "color:var(--danger)" }, r.error) :
      h("div", { class: "result" }, r.reject ? h("b", { style: "color:var(--danger)" }, `Rejected: ${r.reject}`) : h("b", {}, `${r.value} points per 100`),
        h("div", {}, `points ${r.points} · total cost ${r.cost}`), h("div", { class: "muted" }, r.summary)));
  };
  return [
    h("h3", {}, "Try the scorer"),
    h("div", { class: "grid wide" },
      h("label", { class: "f" }, "Listing title", h("input", { placeholder: "OptiPlex 7070 Micro i5-9500T 16GB 256GB SSD", oninput: (e) => (t.title = e.target.value) })),
      h("label", { class: "f" }, "Price", h("input", { type: "number", step: "any", placeholder: "110", oninput: (e) => (t.price = e.target.value) })),
      h("label", { class: "f full" }, "Description (optional)", h("textarea", { rows: 2, oninput: (e) => (t.description = e.target.value) }))),
    h("button", { class: "btn", style: "margin-top:8px", onclick: run }, "Score it"),
    out,
  ];
}

function yamlTab() {
  const area = h("textarea", { rows: 28, spellcheck: false, value: "Loading…" });
  const msg = h("div", { class: "muted", style: "margin:8px 0" });
  api("/api/validate", { config: clean(cfg) }).then((r) => {
    area.value = r.yaml || "";
    msg.textContent = r.ok ? "Config is valid." : `Problem: ${r.error}`;
    msg.style.color = r.ok ? "var(--ok)" : "var(--danger)";
  });
  return [h("div", { class: "card" },
    h("p", { class: "muted", style: "margin-top:0" }, "This is the file the UI will save. You can edit it here and press Apply to load it back into the forms. Comments are not kept."),
    msg, area,
    h("div", { class: "row", style: "margin-top:8px" }, h("button", { class: "btn", onclick: async () => {
      const r = await api("/api/parse-yaml", { yaml: area.value });
      if (r.error) { msg.textContent = `YAML error: ${r.error}`; msg.style.color = "var(--danger)"; return; }
      cfg = normalize(r.config); touch(); show("searches");
    } }, "Apply to forms")))];
}

function podiums() {
  const box = h("div", { class: "podiums" });
  api("/api/podium").then((r) => box.replaceChildren(...(r.searches || []).map((p) => h("div", { class: "card" },
    h("h4", {}, `🏆 ${p.search}`, h("span", { class: "muted", style: "font-weight:400;font-size:12px" },
      p.alerts ? `top ${p.items.length || ""} alerts on` : "per-deal alerts")),
    p.items.length ? p.items.map((d, i) => h("div", { class: "place" },
      h("span", { class: "medal" }, MEDALS[i] || `#${i + 1}`),
      h("div", {}, h("a", { href: d.url, target: "_blank", rel: "noopener noreferrer" }, d.title),
        h("div", { class: "muted" }, `${d.price} ${d.currency} · ${d.summary}`)),
      h("span", { class: "value" }, d.value.toFixed(1))))
      : h("p", { class: "muted" }, "Nothing above the min value yet.")))));

function dealsTab() {
  const q = { search: "", hours: 72 };
  const list = h("div");
  const load = async () => {
    list.replaceChildren(h("p", { class: "muted" }, "Loading…"));
    const r = await api(`/api/top?n=60&hours=${encodeURIComponent(q.hours)}&search=${encodeURIComponent(q.search)}`);
    if (!r.items?.length) { list.replaceChildren(h("p", { class: "muted" }, "Nothing yet – run the scraper (python -m vinted_scraper once) and come back.")); return; }
    list.replaceChildren(h("div", { class: "scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", { class: "hide-sm" }), h("th", {}, "Value"), h("th", {}, "Price"), h("th", {}, "Listing"))),
      h("tbody", {}, r.items.map((d) => h("tr", { class: "deal" },
        h("td", { class: "hide-sm" }, d.photo ? h("img", { src: d.photo, alt: "", loading: "lazy", referrerPolicy: "no-referrer" }) : null),
        h("td", { class: "value" }, d.value.toFixed(1)),
        h("td", { style: "white-space:nowrap" }, `${d.price} ${d.currency}`),
        h("td", {}, h("a", { href: d.url, target: "_blank", rel: "noopener noreferrer" }, d.title),
          h("div", { class: "muted" }, `[${d.search}] ${d.summary}`))))))));
  };
  load();
  return [podiums(), h("div", { class: "card" },
    h("div", { class: "grid" },
      h("label", { class: "f" }, "Search", h("select", { onchange: (e) => { q.search = e.target.value; load(); } },
        h("option", { value: "" }, "All"), cfg.searches.map((s) => h("option", { value: s.name }, s.name)))),
      h("label", { class: "f" }, "Seen in the last (hours)", h("input", { type: "number", value: q.hours, onchange: (e) => { q.hours = e.target.value || 72; load(); } }))),
    h("p", { class: "muted" }, "The best listings the scraper has seen, scored with the saved config. Use it to choose a good \"Min value to notify\"."),
    list)];
}

const TABS = { searches: ["Searches", searchesTab], notifiers: ["Notifications", notifiersTab], general: ["General", generalTab], yaml: ["YAML", yamlTab], deals: ["Deals", dealsTab] };
function show(name) { tab = name; render(); }
function render(openIndex) {
  render.openIndex = openIndex;
  document.getElementById("tabs").replaceChildren(...Object.entries(TABS).map(([k, [label]]) =>
    h("button", { class: k === tab ? "active" : "", onclick: () => show(k) }, label)));
  document.getElementById("main").replaceChildren(...TABS[tab][1]().filter(Boolean));
}

document.getElementById("save").addEventListener("click", async () => {
  const btn = document.getElementById("save");
  btn.disabled = true;
  const r = await api("/api/config", { config: clean(cfg) });
  btn.disabled = false;
  if (r.ok) { dirty = false; setStatus(`Saved to ${r.path}`, "ok"); }
  else setStatus(`Not saved: ${r.error}`, "err");
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  const r = await api("/api/config");
  if (r.error) { setStatus(r.error, "err"); return; }
  cfg = normalize(r.config);
  document.getElementById("path").textContent = r.path;
  if (!r.exists) setStatus("No config yet – starting from the example. Save to create it.", "");
  render();
})();
</script>
</body>
</html>
